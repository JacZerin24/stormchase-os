name: Experimental HRRR georeferenced two-run asset build
on:
  push:
    branches: [feat/hrrr-georeferenced-pilot]
    paths:
      - 'pipelines/hrrr_georeg.py'
      - 'pipelines/tests/test_hrrr_georeg.py'
      - '.github/workflows/hrrr-georeg-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  map-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hrrr-georeferenced-pilot
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned geometry and GRIB dependencies
        run: |
          python -m pip install 'eccodes==2.44.0' 'numpy==2.2.6' 'scipy==1.15.3' 'rasterio==1.4.3' 'Pillow==11.2.1'
      - name: Offline geospatial tests
        run: python -m unittest discover -s pipelines/tests -v
      - name: Retrieve genuine 12Z+6 HRRR TMP 2m
        run: python -m pipelines.hrrr_subset --run 2026-10-27T12:00:00Z --lead 6 --variable TMP --level '2 m above ground' --out /tmp/hrrr_12z_f06.grib2
      - name: Retrieve genuine 15Z+3 HRRR TMP 2m
        run: python -m pipelines.hrrr_subset --run 2026-10-27T15:00:00Z --lead 3 --variable TMP --level '2 m above ground' --out /tmp/hrrr_15z_f03.grib2
      - name: Decode/regrid with geospatial and same-valid-time QA
        run: |
          python -m pipelines.hrrr_georeg --earlier /tmp/hrrr_12z_f06.grib2 --later /tmp/hrrr_15z_f03.grib2 --out web/public/pilot/hrrr-20261027-18z > /tmp/georeg-report.json
          cat /tmp/georeg-report.json
      - name: Commit only small, reviewable archived pilot assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/pilot/hrrr-20261027-18z/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'data(pilot): archive authenticated HRRR georeferenced equal-valid-time case'
            git push origin HEAD:refs/heads/feat/hrrr-georeferenced-pilot
          fi
      - name: Publish QA record even if map generation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-georeferenced-pilot-qa
          path: /tmp/georeg-report.json
          if-no-files-found: warn
          retention-days: 14
