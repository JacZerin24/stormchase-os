name: Historical HRRR convective field/3h UH swath QA
on:
  push:
    branches: [feat/hrrr-convective-archived-maps]
    paths: ['pipelines/hrrr_convective_render.py','pipelines/tests/test_hrrr_convective_render.py','.github/workflows/hrrr-convective-maps.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  real-hrrr:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hrrr-convective-archived-maps
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned ecCodes and geospatial processing dependencies
        run: python -m pip install 'eccodes==2.44.0' 'numpy==2.2.6' 'scipy==1.15.3' 'rasterio==1.4.3' 'Pillow==11.2.1'
      - name: Mathematical source-window checks
        run: python -m unittest pipelines.tests.test_hrrr_convective_render -v
      - name: Fetch authentic 8 NOAA GRIB messages, georegister and create archived fields
        run: python -m pipelines.hrrr_convective_render --out web/public/pilot/hrrr-convective-20261027-20z
      - name: Commit only verified small archive results to reviewable branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/public/pilot/hrrr-convective-20261027-20z/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'data(hrrr): genuine archived simulated reflectivity, upper-air, UH swath QA'
            git push origin HEAD:refs/heads/feat/hrrr-convective-archived-maps
          fi
      - name: Preserve QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrrr-convective-archived-qa
          path: web/public/pilot/hrrr-convective-20261027-20z/manifest.json
          if-no-files-found: warn
          retention-days: 14
