name: Public recent HRRR scientific asset delivery check
on:
  workflow_run:
    workflows: ["HRRR regional forecast publisher (research beta)"]
    types: [completed]
    branches: [main]
  schedule:
    # Independent best-effort stale/missing-asset check, even if the model job never ran.
    - cron: '23 */3 * * *'
  push:
    branches: [test/public-hrrr-assets-acceptance, fix/hrrr-phase1-monitoring-and-feed-health]
    paths:
      - 'tools/pages_live_hrrr_probe.py'
      - '.github/workflows/pages-live-hrrr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read actual Pages model catalog and verify all public HRRR asset hashes
        run: python -m tools.pages_live_hrrr_probe --out reports/live-hrrr-public-qa.json
      - name: Preserve real HTTP evidence even when site fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-hrrr-image-acceptance
          path: reports/live-hrrr-public-qa.json
          if-no-files-found: warn
          retention-days: 14

  publisher-failed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report missed or failed live model refresh
        env:
          PUBLISH_RESULT: ${{ github.event.workflow_run.conclusion }}
          PUBLISH_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "HRRR publisher did not successfully deploy: ${PUBLISH_RESULT}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Publisher run: ${PUBLISH_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Older published assets may remain, but must not be labeled fresh after expiry." >> "${GITHUB_STEP_SUMMARY}"
          exit 1
