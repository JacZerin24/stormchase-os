name: Experimental profile unit tests
on:
  pull_request:
    paths: ['research/**', '.github/workflows/research-ci.yml']
  push:
    branches: [main]
    paths: ['research/**', '.github/workflows/research-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned MetPy reference implementation
        run: python -m pip install metpy==1.7.1
      - name: Analytical plus independent MetPy reference tests
        run: python -m unittest discover -s research/tests -v
