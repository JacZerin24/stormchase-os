name: Archived HRRR convective browser QA
on:
  push:
    branches: [feat/hrrr-convective-archived-maps]
    paths: ['tools/hrrr_convective_browser.py','web/src/**','.github/workflows/hrrr-convective-browser.yml','web/public/pilot/hrrr-convective-20261027-20z/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked frontend
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Exercise all seven actual archived NOAA GRIB map fields
        run: |
          cd web
          npm run dev -- --host 127.0.0.1 --port 4173 >../vite-convective.log 2>&1 &
          cd ..
          python tools/hrrr_convective_browser.py
      - name: Preserve desktop/mobile screenshots and source-state QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-hrrr-convective-browser
          path: |
            browser-artifacts/
            vite-convective.log
          if-no-files-found: warn
          retention-days: 14
