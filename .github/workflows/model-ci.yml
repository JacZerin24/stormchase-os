name: Model ingest contract tests
on:
  pull_request:
    paths: ['pipelines/**', '.github/workflows/model-ci.yml']
  push:
    branches: [main]
    paths: ['pipelines/**', '.github/workflows/model-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s pipelines/tests -v
