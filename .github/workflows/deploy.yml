name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
        working-directory: web
      - name: Restore last successful HRRR model cache (fail rather than silently erase)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          runs="$(gh run list --workflow hrrr-live-publish.yml --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId')"
          if [ -n "$runs" ]; then
            mkdir -p web/public/live/hrrr
            found=false
            for run in $runs; do
              if gh run download "$run" -n hrrr-live-cache -D web/public/live/hrrr; then
                python -c 'from pathlib import Path;from pipelines.hrrr_pages_cache import verify;verify(Path("web/public/live/hrrr"))'
                found=true
                break
              fi
            done
            if [ "$found" != true ]; then
              echo "Prior live model assets unavailable; blocking unintended Pages rollback"
              exit 1
            fi
          fi
      - name: Build Pages bundle
        run: npm run build
        working-directory: web
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
